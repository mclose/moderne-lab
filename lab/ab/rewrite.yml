type: specs.openrewrite.org/v1beta/recipe
name: lab.FixLog4Shell
displayName: Upgrade log4j-core past Log4Shell
description: Upgrade org.apache.logging.log4j:log4j-core to 2.26.1 wherever it is declared or managed.
recipeList:
